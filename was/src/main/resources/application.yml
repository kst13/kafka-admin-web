spring:
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/kafka-admin
  jpa:
    hibernate:
      ddl-auto: update
app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    sasl-jaas: ${KAFKA_SASL_JAAS:}
    truststore-location: ${KAFKA_TRUSTSTORE_LOCATION:}
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD:}
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  schema-registry:
    urls: ${SCHEMA_REGISTRY_URLS:}
    timeout-ms: ${SCHEMA_REGISTRY_TIMEOUT_MS:5000}
  prometheus:
    url: ${PROMETHEUS_URL:}
    timeout-ms: ${PROMETHEUS_TIMEOUT_MS:5000}
    jmx-port: ${PROMETHEUS_JMX_PORT:7071}
    cache-seconds: ${PROMETHEUS_CACHE_SECONDS:15}
  monitor:
    enabled: ${MONITOR_ENABLED:true}
    collect-interval-ms: ${MONITOR_COLLECT_INTERVAL_MS:60000}
    lag-threshold: ${MONITOR_LAG_THRESHOLD:1000}
    disk-used-pct-threshold: ${MONITOR_DISK_USED_PCT_THRESHOLD:80}
    cert-warn-days: ${MONITOR_CERT_WARN_DAYS:30}
    cooldown-minutes: ${MONITOR_COOLDOWN_MINUTES:30}
    retention-days: ${MONITOR_RETENTION_DAYS:7}
    p99-produce-ms-threshold: ${MONITOR_P99_PRODUCE_MS:1000}
    p99-fetch-ms-threshold: ${MONITOR_P99_FETCH_MS:2000}
    handler-idle-min-pct: ${MONITOR_HANDLER_IDLE_MIN_PCT:20}
    heap-used-pct-threshold: ${MONITOR_HEAP_USED_PCT:85}
