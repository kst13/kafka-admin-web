spring:
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/kafka-admin
  jpa:
    hibernate:
      ddl-auto: update
app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    sasl-jaas: ${KAFKA_SASL_JAAS:}
    truststore-location: ${KAFKA_TRUSTSTORE_LOCATION:}
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD:}
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  monitor:
    enabled: ${MONITOR_ENABLED:true}
    lag-threshold: ${MONITOR_LAG_THRESHOLD:1000}
    disk-used-pct-threshold: ${MONITOR_DISK_USED_PCT_THRESHOLD:80}
    cert-warn-days: ${MONITOR_CERT_WARN_DAYS:30}
    cooldown-minutes: ${MONITOR_COOLDOWN_MINUTES:30}
    retention-days: ${MONITOR_RETENTION_DAYS:7}
